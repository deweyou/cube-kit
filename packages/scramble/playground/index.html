<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@cubekit/scramble — playground</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        max-width: 960px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 24px;
      }
      select,
      button {
        font-size: 14px;
        padding: 6px 12px;
      }
      .output {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      pre#scramble {
        background: rgba(127, 127, 127, 0.12);
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 120px;
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      #svg {
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      #svg svg {
        max-width: 100%;
        height: auto;
      }
      @media (max-width: 720px) {
        .output {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>@cubekit/scramble — playground</h1>
    <div class="controls">
      <label for="event">Event:</label>
      <select id="event"></select>
      <button id="gen" type="button">Generate</button>
    </div>
    <div class="output">
      <pre id="scramble"></pre>
      <div id="svg"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
