packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^24
  '@types/react': ^19
  '@types/react-dom': ^19
  '@vitejs/plugin-react': ^4
  react: ^19
  react-dom: ^19
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
    '@deweyou-design/react>react': '18 || 19'
