packages:
  - apps/*
  - packages/*

catalog:
  '@deweyou-design/react': ^0.3.1
  '@deweyou-design/styles': ^0.3.1
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^24
  '@types/react': ^19
  '@types/react-dom': ^19
  '@vitejs/plugin-react': ^4
  '@vitest/coverage-v8': 4.1.4
  react: ^19
  react-dom: ^19
  react-router: ^7.10.1
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    '@deweyou-design/react>react': '18 || 19'
    vite: '*'
    vitest: '*'
